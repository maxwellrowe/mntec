name: Deploy themes via SFTP

on:
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'scripts/deploy-sftp.py'
      - '.github/workflows/deploy-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-sftp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check PHP syntax
        run: find themes -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-paramiko

      - name: Upload themes
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: /usr/bin/python3 scripts/deploy-sftp.py
